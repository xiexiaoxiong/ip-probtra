[project]
name = "patent-invalidity-search"
version = "0.1.0"
description = "Isolated, evidence-first patent invalidity search service"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    "openpyxl>=3.1,<4",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.12,<3",
    "pymupdf>=1.27,<2",
    "python-dotenv>=1.2,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

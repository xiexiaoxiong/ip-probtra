[project]
name = "patent-product-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14.0",
  "fastapi>=0.121.0",
  "httpx>=0.28.0",
  "lxml>=6.0.0",
  "pydantic>=2.12.0",
  "python-dotenv>=1.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

